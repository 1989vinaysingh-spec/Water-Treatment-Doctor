name: Build Water Treatment Doctor Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/vinaykumarsingh/watertreatmentdoctor
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WaterTreatmentDoctor"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vinaykumarsingh.watertreatmentdoctor'
              compileSdk 36

              defaultConfig {
                  applicationId "com.vinaykumarsingh.watertreatmentdoctor"
                  minSdk 23
                  targetSdk 36
                  versionCode 185540
                  versionName "18.5.5 Build 22.16 Final Fix"
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Water Treatment Doctor"
                  android:icon="@drawable/app_icon"
                  android:usesCleartextTraffic="true">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowBackground">#EEF9FF</item>
                  <item name="android:statusBarColor">#EEF9FF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="camera_cache" path="." />
          </paths>
          EOF

          cat > app/src/main/java/com/vinaykumarsingh/watertreatmentdoctor/MainActivity.java <<'EOF'
          package com.vinaykumarsingh.watertreatmentdoctor;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {

              private static final int FILE_CHOOSER_REQUEST = 1001;

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private Uri cameraOutputUri;
              private Uri videoOutputUri;

              public class DownloadBridge {
                  @JavascriptInterface
                  public void saveAsset(String assetPath, String requestedName) {
                      final String cleanPath = assetPath == null ? "" : assetPath.replaceFirst("^/+", "");
                      String cleanName = requestedName == null ? "drawing.png" : requestedName.replaceAll("[^A-Za-z0-9._-]", "_");
                      if (!cleanName.toLowerCase().endsWith(".png")) cleanName += ".png";
                      final String fileName = cleanName;
                      if (cleanPath.isEmpty() || cleanPath.contains("..")) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Invalid drawing path", Toast.LENGTH_SHORT).show());
                          return;
                      }
                      new Thread(() -> {
                          try (InputStream in = getAssets().open(cleanPath)) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                                  values.put(MediaStore.Downloads.MIME_TYPE, "image/png");
                                  values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Water Treatment Doctor");
                                  values.put(MediaStore.Downloads.IS_PENDING, 1);
                                  Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                  if (uri == null) throw new IOException("Could not create download");
                                  try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                                      if (out == null) throw new IOException("Could not open download");
                                      byte[] buf = new byte[8192]; int n; while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                                  }
                                  values.clear(); values.put(MediaStore.Downloads.IS_PENDING, 0);
                                  getContentResolver().update(uri, values, null, null);
                              } else {
                                  File dir = new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "Water Treatment Doctor");
                                  if (!dir.exists() && !dir.mkdirs()) throw new IOException("Could not create folder");
                                  try (OutputStream out = new FileOutputStream(new File(dir, fileName))) {
                                      byte[] buf = new byte[8192]; int n; while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                                  }
                              }
                              runOnUiThread(() -> Toast.makeText(MainActivity.this, "Drawing saved to Downloads / ड्रॉइंग सेव हो गई", Toast.LENGTH_LONG).show());
                          } catch (Exception e) {
                              runOnUiThread(() -> Toast.makeText(MainActivity.this, "Download failed: " + e.getMessage(), Toast.LENGTH_LONG).show());
                          }
                      }).start();
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.addJavascriptInterface(new DownloadBridge(), "AndroidDownloads");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallbackParam,
                              FileChooserParams fileChooserParams) {

                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }

                          filePathCallback = filePathCallbackParam;

                          String[] acceptTypes = fileChooserParams.getAcceptTypes();
                          String accept = "";
                          if (acceptTypes != null && acceptTypes.length > 0 && acceptTypes[0] != null) {
                              accept = acceptTypes[0];
                          }

                          boolean acceptsImage = accept.isEmpty() || accept.contains("image") || accept.equals("*/*");
                          boolean acceptsVideo = accept.isEmpty() || accept.contains("video") || accept.equals("*/*");
                          boolean mixedMedia = acceptsImage && acceptsVideo;

                          Intent contentIntent = new Intent(Intent.ACTION_GET_CONTENT);
                          contentIntent.addCategory(Intent.CATEGORY_OPENABLE);
                          if (mixedMedia) {
                              contentIntent.setType("*/*");
                              contentIntent.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"image/*", "video/*"});
                          } else {
                              contentIntent.setType(accept.isEmpty() ? "*/*" : accept);
                          }
                          contentIntent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE,
                                  fileChooserParams.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE);

                          java.util.ArrayList<Intent> extraIntents = new java.util.ArrayList<>();

                          // Mixed Photo/Video uses the gallery picker. Dedicated buttons below request only one camera mode, avoiding ambiguous returned URIs.
                          if (acceptsImage && !mixedMedia) {
                              try {
                                  File imageFile = File.createTempFile("wtd_photo_", ".jpg", getCacheDir());
                                  cameraOutputUri = FileProvider.getUriForFile(
                                          MainActivity.this,
                                          getPackageName() + ".fileprovider",
                                          imageFile
                                  );

                                  Intent cameraIntent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                                  cameraIntent.putExtra(MediaStore.EXTRA_OUTPUT, cameraOutputUri);
                                  cameraIntent.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION |
                                          Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  extraIntents.add(cameraIntent);
                              } catch (IOException ignored) {
                                  cameraOutputUri = null;
                              }
                          }

                          if (acceptsVideo && !mixedMedia) {
                              try {
                                  File videoFile = File.createTempFile("wtd_video_", ".mp4", getCacheDir());
                                  videoOutputUri = FileProvider.getUriForFile(
                                          MainActivity.this,
                                          getPackageName() + ".fileprovider",
                                          videoFile
                                  );

                                  Intent videoIntent = new Intent(MediaStore.ACTION_VIDEO_CAPTURE);
                                  videoIntent.putExtra(MediaStore.EXTRA_OUTPUT, videoOutputUri);
                                  videoIntent.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION |
                                          Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  extraIntents.add(videoIntent);
                              } catch (IOException ignored) {
                                  videoOutputUri = null;
                              }
                          }

                          Intent chooser = new Intent(Intent.ACTION_CHOOSER);
                          chooser.putExtra(Intent.EXTRA_INTENT, contentIntent);
                          chooser.putExtra(
                                  Intent.EXTRA_INITIAL_INTENTS,
                                  extraIntents.toArray(new Intent[0])
                          );

                          try {
                              startActivityForResult(chooser, FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode != FILE_CHOOSER_REQUEST || filePathCallback == null) {
                      return;
                  }

                  Uri[] results = null;

                  if (resultCode == Activity.RESULT_OK) {
                      if (data != null) {
                          String dataString = data.getDataString();

                          if (data.getClipData() != null) {
                              ClipData clipData = data.getClipData();
                              results = new Uri[clipData.getItemCount()];
                              for (int i = 0; i < clipData.getItemCount(); i++) {
                                  results[i] = clipData.getItemAt(i).getUri();
                              }
                          } else if (dataString != null) {
                              results = new Uri[]{Uri.parse(dataString)};
                          }
                      }

                      if (results == null) {
                          if (cameraOutputUri != null) {
                              results = new Uri[]{cameraOutputUri};
                          } else if (videoOutputUri != null) {
                              results = new Uri[]{videoOutputUri};
                          }
                      }
                  }

                  filePathCallback.onReceiveValue(results);
                  filePathCallback = null;
                  cameraOutputUri = null;
                  videoOutputUri = null;
              }

              private void exitOrWebBack() {
                  if (webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }

              @Override
              public void onBackPressed() {
                  webView.evaluateJavascript(
                      "(function(){" +
                      "var d=document.getElementById('drawingModal');if(d&&d.classList.contains('show')){if(window.closeDrawing)closeDrawing();return 'handled';}" +
                      "var p=document.getElementById('appOverviewModal');if(p&&p.classList.contains('show')){if(window.closeAppOverview)closeAppOverview();return 'handled';}" +
                      "if(document.body.classList.contains('wtd-app-page-open')){if(window.closeAppPage)closeAppPage();return 'handled';}" +
                      "return 'exit';})()",
                      value -> {
                          if (value != null && value.contains("handled")) return;
                          exitOrWebBack();
                      }
                  );
              }
          }
          EOF

          cp icon-192.png app/src/main/res/drawable/app_icon.png

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='app' \
            --exclude='build.gradle' \
            --exclude='settings.gradle' \
            ./ app/src/main/assets/

      - name: Build APK and AAB
        run: |
          gradle assembleDebug bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Treatment-Doctor-V18.5.5-Build22.16-FINAL-FIX-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Water-Treatment-Doctor-V18.5.5-Build22.16-FINA-FIX-AAB
          path: app/build/outputs/bundle/release/app-release.aab
