services:
  - type: web
    name: water-treatment-doctor-ai
    runtime: node
    rootDir: ai-backend
    buildCommand: ""
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: ALLOWED_ORIGIN
        value: "*"
