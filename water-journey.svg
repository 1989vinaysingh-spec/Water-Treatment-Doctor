<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" role="img" aria-label="Every Drop Has a Journey: Raw Water to Treatment Process to Clean Water">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7fcff"/><stop offset=".55" stop-color="#e8f7ff"/><stop offset="1" stop-color="#f5fff9"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#69d8ff"/><stop offset="1" stop-color="#087dbd"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c6590" flood-opacity=".18"/></filter>
</defs>
<rect width="520" height="760" rx="34" fill="url(#bg)"/>
<text x="260" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#123d72">Every Drop</text>
<text x="260" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#123d72">Has a Journey</text>

<!-- Raw water -->
<g filter="url(#sh)">
 <circle cx="260" cy="180" r="78" fill="#fff" stroke="#c8e9f7" stroke-width="5"/>
 <path d="M190 190 C215 150 236 160 260 145 C286 128 314 150 335 177 L335 222 L185 222Z" fill="#77b86d"/>
 <path d="M188 198 C225 174 252 214 288 187 C310 171 328 184 337 194 L337 224 L185 224Z" fill="#369ed0"/>
 <path d="M202 130 C220 144 231 153 244 169" stroke="#6b4b31" stroke-width="12" fill="none" stroke-linecap="round"/>
 <path d="M204 132 C222 139 235 145 249 158" stroke="#8a6a4a" stroke-width="19" fill="none" stroke-linecap="round"/>
 <path d="M245 160 C254 167 263 176 271 188" stroke="#e9f8ff" stroke-width="13" fill="none" stroke-linecap="round"/>
</g>
<text x="260" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#173e70">Raw Water</text>
<path d="M260 300v45" stroke="#2daee5" stroke-width="9" stroke-linecap="round"/><path d="M244 335l16 18 16-18" fill="none" stroke="#2daee5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

<!-- treatment -->
<g transform="translate(182 370)" filter="url(#sh)">
 <rect x="0" y="38" width="156" height="92" rx="8" fill="#eefaff" stroke="#1777a7" stroke-width="5"/>
 <rect x="15" y="0" width="42" height="130" rx="7" fill="#dff5fb" stroke="#1777a7" stroke-width="5"/>
 <ellipse cx="36" cy="0" rx="21" ry="8" fill="#bce8f4" stroke="#1777a7" stroke-width="5"/>
 <rect x="72" y="20" width="30" height="110" rx="6" fill="#e8f8fb" stroke="#1777a7" stroke-width="5"/>
 <rect x="116" y="9" width="25" height="121" rx="5" fill="#e8f8fb" stroke="#1777a7" stroke-width="5"/>
 <path d="M57 65h15M102 55h14" stroke="#19a38a" stroke-width="8"/>
</g>
<text x="260" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="#173e70">Treatment Process</text>
<path d="M260 550v38" stroke="#2daee5" stroke-width="9" stroke-linecap="round"/><path d="M244 579l16 18 16-18" fill="none" stroke="#2daee5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

<!-- clean water -->
<g filter="url(#sh)">
 <circle cx="260" cy="654" r="63" fill="#fff" stroke="#c8e9f7" stroke-width="5"/>
 <path d="M205 655 C228 635 248 670 273 646 C293 628 311 648 320 656 L320 695 L200 695Z" fill="url(#water)"/>
 <path d="M213 628 C235 614 256 620 274 610 C290 601 305 606 316 615" stroke="#64b96b" stroke-width="12" fill="none" stroke-linecap="round"/>
</g>
<text x="260" y="742" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="#173e70">Clean Water</text>
</svg>